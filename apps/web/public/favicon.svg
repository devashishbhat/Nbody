<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A body on an orbit. Reads at 16 pixels, which a more detailed mark
       would not. -->
  <rect width="32" height="32" rx="7" fill="#08080a" />
  <ellipse
    cx="16"
    cy="16"
    rx="11"
    ry="6.5"
    fill="none"
    stroke="#7aa2f7"
    stroke-opacity="0.55"
    stroke-width="1.4"
    transform="rotate(-24 16 16)"
  />
  <circle cx="16" cy="16" r="3.6" fill="#ffd277" />
  <circle cx="25.2" cy="11.8" r="2.1" fill="#7aa2f7" />
</svg>
