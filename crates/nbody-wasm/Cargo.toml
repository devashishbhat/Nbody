[package]
name = "nbody-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "WebAssembly boundary for nbody-core."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nbody-core = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# Keep debug symbols out but keep the name section, so a profile in the browser
# is still readable.
wasm-opt = ["-O3"]
