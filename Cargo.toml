[workspace]
members = ["crates/nbody-core", "crates/nbody-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
nbody-core = { path = "crates/nbody-core" }
wide = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Physics is the hot path in every build, including the ones used for
# debugging, so it is always optimised.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
